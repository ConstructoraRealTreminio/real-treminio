<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Out of Service</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Fondo decorativo de malla */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Contenedor del mensaje central */
    .message-container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2.5rem;
      max-width: 600px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(239, 68, 68, 0.1);
    }

    .warning-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: inline-block;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f87171;
      margin-bottom: 1rem;
      letter-spacing: -0.025em;
      text-transform: uppercase;
    }

    .description {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #94a3b8;
      font-weight: 400;
    }

    /* Animación de la Lupa */
    .magnifier-track {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .magnifier {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140px;
      height: 140px;
      margin-top: -70px;
      margin-left: -70px;
      animation: searchAnimation 10s infinite ease-in-out;
    }

    .glass {
      width: 100px;
      height: 100px;
      border: 8px solid #38bdf8;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(56, 189, 248, 0.02) 70%);
      box-shadow: 
        0 0 20px rgba(56, 189, 248, 0.4),
        inset 0 0 15px rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(2px);
    }

    /* Brillo en el cristal de la lupa */
    .glass::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 14px;
      width: 30px;
      height: 16px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      transform: rotate(-40deg);
    }

    .handle {
      position: absolute;
      top: 82px;
      left: 82px;
      width: 16px;
      height: 65px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      border-radius: 8px;
      transform: rotate(-45deg);
      transform-origin: top left;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    }

    /* Haz de luz bajo la lupa */
    .beam {
      position: absolute;
      top: -20px;
      left: -20px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
      animation: pulseBeam 2s infinite alternate ease-in-out;
    }

    /* Trayectoria de búsqueda por toda la pantalla */
    @keyframes searchAnimation {
      0% {
        transform: translate(-35vw, -30vh) scale(1);
      }
      20% {
        transform: translate(30vw, -25vh) scale(1.1);
      }
      40% {
        transform: translate(25vw, 25vh) scale(0.95);
      }
      60% {
        transform: translate(-30vw, 20vh) scale(1.05);
      }
      80% {
        transform: translate(0vw, -10vh) scale(1);
      }
      100% {
        transform: translate(-35vw, -30vh) scale(1);
      }
    }

    @keyframes pulseBeam {
      from { opacity: 0.4; transform: scale(0.9); }
      to { opacity: 0.9; transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>

  <!-- Mensaje Central -->
  <div class="message-container">
    <div class="warning-icon">⚠️</div>
    <h1 class="title">Service Unavailable</h1>
    <p class="description">
      We are sorry, the website you are trying to reach is currently out of service, outdated or no longer exist.
    </p>
  </div>

  <!-- Lupa en Búsqueda Continua -->
  <div class="magnifier-track">
    <div class="magnifier">
      <div class="beam"></div>
      <div class="glass"></div>
      <div class="handle"></div>
    </div>
  </div>

</body>
</html>
